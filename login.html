<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CargoConnect - Authentication</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), 
                        url('truck-bg.jpg') no-repeat center center/cover;
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .auth-container { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); width: 100%; max-width: 400px; margin-bottom: 20px; border-top: 5px solid #0284c7; }
        .auth-container h2 { margin-bottom: 10px; color: #0f172a; text-align: center; }
        .role-badge { text-align: center; font-size: 14px; color: #0284c7; margin-bottom: 25px; font-weight: 600; text-transform: uppercase; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: 600; color: #64748b; }
        .tab.active { color: #0284c7; border-bottom: 2px solid #0284c7; margin-bottom: -2px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #334155; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        .btn-submit { width: 100%; background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: 650; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-submit:hover { background: #0369a1; }
        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; text-decoration: none; }
        .back-link:hover { text-decoration: underline; color: #0284c7; }
        .error-msg { color: #d90429; font-size: 13px; margin-top: 5px; text-align: center; display: none; }
        
        .mini-footer { font-size: 12px; color: #cbd5e1; text-align: center; max-width: 400px; line-height: 1.5; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
        .mini-footer span { color: #38bdf8; font-weight: 600; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 id="form-title">Login</h2>
        <div class="role-badge" id="role-display">Role: Shipper</div>

        <div class="tabs">
            <div class="tab active" onclick="switchMode('login')">Login</div>
            <div class="tab" onclick="switchMode('signup')">Sign Up</div>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group" id="name-group" style="display: none;">
                <label>Full Name / Company Name</label>
                <input type="text" id="fullname" placeholder="Enter name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <div id="error-box" class="error-msg"></div>
            <button type="submit" class="btn-submit" id="submit-btn">Login</button>
        </form>

        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>

    <div class="mini-footer">
        CargoConnect &bull; Developed by <span>Tinashe Muchenje</span> &amp; <span>Dylan Zvavahera</span>[cite: 1]
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const role = urlParams.get('role') || 'shipper';
        
        document.getElementById('role-display').innerText = `Portal: ${role.toUpperCase()}`;
        
        let isLoginMode = true;

        function switchMode(mode) {
            isLoginMode = (mode === 'login');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            document.getElementById('form-title').innerText = isLoginMode ? 'Login' : 'Create Account';
            document.getElementById('submit-btn').innerText = isLoginMode ? 'Login' : 'Sign Up';
            document.getElementById('name-group').style.display = isLoginMode ? 'none' : 'block';
            document.getElementById('error-box').style.display = 'none';
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');

            // Master bypass for testing
            const isMasterTestAccount = (email === 'tinashemuchenje29@gmail.com' && password === 'panashe#4');

            let users = JSON.parse(localStorage.getItem('cargoconnect_users_' + role)) || [];

            if (isLoginMode) {
                const foundUser = users.find(u => u.email === email && u.password === password);
                
                if (foundUser || isMasterTestAccount) {
                    const userName = foundUser ? (foundUser.name || email) : 'Tinashe Muchenje';
                    localStorage.setItem('cargoconnect_current_user', JSON.stringify({ email: email, name: userName, role: role }));
                    window.location.href = 'dashboard.html';
                } else {
                    errorBox.innerText = 'Invalid email or password.';
                    errorBox.style.display = 'block';
                }
            } else {
                const fullname = document.getElementById('fullname').value.trim() || 'Tinashe Muchenje';
                const existingUser = users.find(u => u.email === email);
                
                if (existingUser && !isMasterTestAccount) {
                    errorBox.innerText = 'Email already registered. Please login.';
                    errorBox.style.display = 'block';
                } else {
                    if (!isMasterTestAccount) {
                        users.push({ name: fullname, email: email, password: password });
                        localStorage.setItem('cargoconnect_users_' + role, JSON.stringify(users));
                    }
                    localStorage.setItem('cargoconnect_current_user', JSON.stringify({ email: email, name: fullname, role: role }));
                    window.location.href = 'dashboard.html';
                }
            }
        }
    </script>
</body>
</html>
